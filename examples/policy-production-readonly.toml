[policy]
allowed_executables = ["curl", "psql"]
allowed_runtimes = []
cwd_roots = ["/srv/operations/read-only"]
environment_allowlist = ["PGSERVICE"]
max_runtime_seconds = 120
max_request_bytes = 262144
max_output_bytes = 4194304
max_upload_bytes = 1048576
max_artifact_bytes = 1048576
read_only = true
approval_hook = "/usr/local/libexec/fs-exec-approve-readonly"
